[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frailty-index-deficit-accumulation-model"
version = "0.1.0"
description = "Deterministic deficit-accumulation scoring and a guarded biological-age model interface."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100",
  "numpy>=1.24",
  "pydantic>=2.0",
  "uvicorn>=0.23",
]

[project.optional-dependencies]
ml = ["xgboost>=2.0"]
validation = ["matplotlib>=3.7"]
data = ["pandas>=2.0"]
dev = [
  "pytest>=7.4",
  "httpx>=0.24",
  "matplotlib>=3.7",
  "ruff>=0.6",
  "build>=1.2",
]

[project.scripts]
frailty-engine = "frailty_engine.__main__:main"
frailty-engine-mcp = "frailty_engine.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
