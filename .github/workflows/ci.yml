name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install uv and the locked project environment
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --extra dev --extra ml --extra data
      - name: Lint and format check
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Compile Python sources
        run: uv run python -m compileall -q src scripts
      - name: Run tests
        run: uv run python -m pytest
      - name: Verify synthetic external-validation fixture
        run: |
          uv run python scripts/build_demo_data.py --check
          uv run python scripts/build_external_validation_fixture.py --output examples/external_validation_synthetic.json --check
          uv run python scripts/run_external_validation_report.py --check
          uv run python scripts/run_external_validation_smoke.py
          uv run python scripts/run_training_split_smoke.py
      - name: Build wheel
        run: uv run python -m build --wheel
      - name: Smoke-test the built wheel installation
        run: |
          uv export --locked --extra ml --no-dev --no-editable --no-emit-project --format requirements.txt --output-file /tmp/healthspan-runtime-requirements.txt
          uv venv .wheel-smoke
          uv pip sync --python .wheel-smoke/bin/python /tmp/healthspan-runtime-requirements.txt
          uv pip install --python .wheel-smoke/bin/python --no-deps dist/*.whl
          .wheel-smoke/bin/python scripts/verify_package_install.py
          .wheel-smoke/bin/python scripts/run_serving_contract_smoke.py
      - name: Check Pages JavaScript syntax
        run: |
          node --version
          node --check docs/seca-parser.js
          node --check docs/intake-form.js
          node --check docs/site.js
          node --test tests/site_parser.test.cjs
      - name: Check public evidence receipts
        run: |
          uv run python scripts/capture_release_receipt.py --help
          uv run python scripts/validate_model_release.py --help
          uv run python scripts/review_nhanes_intake.py --help
          uv run python scripts/build_test_receipt.py --check
          uv run python scripts/run_external_validation_report.py --check
          uv run python scripts/verify_docs.py
      - name: Verify PDF intake and clinician workbench
        run: node --test api/extract-pdf.test.js tests/app_nav.test.cjs tests/clinic_companion.test.cjs tests/clinical_parser.test.cjs tests/manual.test.cjs tests/pdf_batches.test.cjs tests/pdf_candidate_review.test.cjs tests/pdf_request_scheduler.test.cjs tests/site_parser.test.cjs tests/workbench.test.cjs tests/test_pdf_intake_contract.js

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install uv and the locked project environment
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --extra dev --extra ml --extra data
      - name: Run Python tests
        run: uv run python -m pytest
      - name: Check Pages JavaScript syntax and tests
        run: |
          node --check docs/seca-parser.js
          node --check docs/intake-form.js
          node --check docs/site.js
          node --test tests/site_parser.test.cjs
      - name: Verify docs and training manifest
        run: |
          uv run python scripts/build_test_receipt.py --check
          uv run python scripts/run_external_validation_report.py --check
          uv run python scripts/verify_docs.py
          uv run python scripts/validate_training_manifest.py docs/TRAINING_MANIFEST_TEMPLATE.json
          uv run python scripts/review_nhanes_intake.py --help
      - name: Verify PDF intake and clinician workbench
        run: node --test api/extract-pdf.test.js tests/app_nav.test.cjs tests/clinic_companion.test.cjs tests/clinical_parser.test.cjs tests/manual.test.cjs tests/pdf_batches.test.cjs tests/pdf_candidate_review.test.cjs tests/pdf_request_scheduler.test.cjs tests/site_parser.test.cjs tests/workbench.test.cjs tests/test_pdf_intake_contract.js
      - name: Build and smoke-test the Windows wheel installation
        shell: pwsh
        run: |
          uv build --wheel
          $requirements = Join-Path $env:RUNNER_TEMP "healthspan-runtime-requirements.txt"
          uv export --locked --extra ml --no-dev --no-editable --no-emit-project --format requirements.txt --output-file $requirements
          uv venv .wheel-smoke-windows
          $wheelPython = (Resolve-Path .wheel-smoke-windows\Scripts\python.exe).Path
          uv pip sync --python $wheelPython $requirements
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          uv pip install --python $wheelPython --no-deps $wheel
          & $wheelPython scripts/verify_package_install.py
          & $wheelPython scripts/run_serving_contract_smoke.py
