name: deploy-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install locked documentation dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --extra dev --extra data
      - name: Verify public evidence and Pages parser
        run: |
          uv run python -m pytest -q
          uv run python scripts/verify_publication_failure_demo.py --check
          uv run python scripts/verify_docs.py
          node --check docs/seca-parser.js
          node --check docs/intake-form.js
          node --check docs/site.js
          node --test tests/site_parser.test.cjs
          node --test api/extract-pdf.test.js tests/app_nav.test.cjs tests/clinic_companion.test.cjs tests/clinical_parser.test.cjs tests/manual.test.cjs tests/pdf_batches.test.cjs tests/pdf_candidate_review.test.cjs tests/pdf_request_scheduler.test.cjs tests/site_parser.test.cjs tests/workbench.test.cjs tests/test_pdf_intake_contract.js

      - name: Regenerate and verify the synthetic demo artifact
        run: uv run python scripts/build_demo_data.py --check

      - name: Verify the synthetic external-validation artifacts
        run: |
          uv run python scripts/build_external_validation_fixture.py --output examples/external_validation_synthetic.json --check
          uv run python scripts/run_external_validation_report.py --check

      - name: Verify the checked-in test receipt
        run: uv run python scripts/build_test_receipt.py --check

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject build metadata into the Pages bundle
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_REPOSITORY: ${{ github.repository }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/build_pages_metadata.py \
            --commit "$BUILD_COMMIT" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --repository "$BUILD_REPOSITORY" \
            --run-id "$BUILD_RUN_ID"
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs
      - name: Wait for the uploaded Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in 1 2 3 4 5; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == env.PAGES_ARTIFACT_NAME and .expired == false)] | length')
            if [ "$count" = "1" ]; then exit 0; fi
            if [ "$count" != "0" ]; then
              echo "Ambiguous Pages artifact; refusing deployment."
              exit 1
            fi
            sleep 3
          done
          echo "Uploaded Pages artifact is not visible yet."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
